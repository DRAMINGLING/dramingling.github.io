<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人文档库</title>
  <script>
    (function(){
      const TOKEN_KEY = "pd_access_token";
      const AUTH_PAGE = "/auth.html";

      // 检查是否已认证
      if (sessionStorage.getItem(TOKEN_KEY) !== "ok") {
        const params = new URLSearchParams({ redirect: location.href });
        location.href = AUTH_PAGE + "?" + params.toString();
      }

      // 提供退出函数
      window.logout = function() {
        sessionStorage.removeItem(TOKEN_KEY);
        const params = new URLSearchParams({ redirect: location.href });
        location.href = AUTH_PAGE + "?" + params.toString();
      };
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      background: #f4f6f9;
      color: #333;
    }
    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header p {
      margin: 4px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
    .logout-btn {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    section {
      margin-bottom: 34px;
    }
    section h2 {
      margin: 0 0 8px;
      font-size: 20px;
      color: #444;
    }
    .section-description,
    .section-status {
      margin: 0 0 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    .section-status:empty {
      display: none;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .file-row {
      background: white;
      border-radius: 8px;
      padding: 15px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-info h3 {
      margin: 0;
      font-size: 18px;
      color: #444;
      overflow-wrap: anywhere;
    }
    .file-info p {
      margin: 4px 0 0;
      font-size: 13px;
      color: #666;
    }
    .file-row a {
      padding: 8px 12px;
      background: #667eea;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      margin-left: 20px;
      white-space: nowrap;
    }
    @media (max-width: 560px) {
      header {
        align-items: flex-start;
        gap: 16px;
      }
      header h1 {
        font-size: 20px;
      }
      .file-row {
        align-items: flex-start;
        flex-direction: column;
      }
      .file-row a {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📂 我的个人文档库</h1>
      <p>已通过身份验证，可访问以下文件</p>
    </div>
    <button class="logout-btn" onclick="logout()">退出登录</button>
  </header>
  
  <div class="container">
    <section aria-labelledby="manual-files-heading">
      <h2 id="manual-files-heading">置顶</h2>
      <div class="file-list">
        <!-- 手动条目区：新增条目时复制一个 file-row 区块。 -->
        <div class="file-row">
          <div class="file-info">
            <h3>B站会员购监控</h3>
          </div>
          <a href="https://dramingling.github.io/personal_documents/Bilibili_Goods_Price_Monitor" target="_blank" rel="noopener noreferrer">查看</a>
        </div>

        <div class="file-row">
          <div class="file-info">
            <h3>旅行计划.xlsx</h3>
            <p>2025年旅行计划表</p>
          </div>
          <a href="travel_plan.xlsx" target="_blank" rel="noopener noreferrer">查看</a>
        </div>
      </div>
    </section>
  
    <section aria-labelledby="repository-files-heading">
      <h2 id="repository-files-heading">Personal Documents</h2>
      <p class="section-status" id="repository-file-status" role="status" aria-live="polite">正在读取 PDF 文件…</p>
      <div class="file-list" id="repository-file-list"></div>
    </section>
  </div>

  <script>
    (function() {
      const TREE_URL = "https://api.github.com/repos/DRAMINGLING/Personal_Documents/git/trees/main?recursive=1";
      const FILE_BASE_URL = "https://dramingling.github.io/Personal_Documents/";
      const fileList = document.getElementById("repository-file-list");
      const status = document.getElementById("repository-file-status");

      function encodePath(path) {
        return path.split("/").map(function(segment) {
          return encodeURIComponent(segment);
        }).join("/");
      }

      function createFileRow(file) {
        const row = document.createElement("div");
        row.className = "file-row";

        const info = document.createElement("div");
        info.className = "file-info";

        const title = document.createElement("h3");
        const parts = file.path.split("/");
        title.textContent = parts[parts.length - 1];
        info.appendChild(title);

        if (parts.length > 1) {
          const folder = document.createElement("p");
          folder.textContent = parts.slice(0, -1).join("/");
          info.appendChild(folder);
        }

        const link = document.createElement("a");
        link.href = FILE_BASE_URL + encodePath(file.path);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "查看";

        row.appendChild(info);
        row.appendChild(link);
        return row;
      }

      fetch(TREE_URL, {
        headers: { Accept: "application/vnd.github+json" },
        cache: "no-store"
      })
        .then(function(response) {
          if (!response.ok) {
            throw new Error("GitHub API returned " + response.status);
          }
          return response.json();
        })
        .then(function(data) {
          if (data.truncated) {
            throw new Error("Repository file list was truncated");
          }

          const pdfFiles = data.tree
            .filter(function(item) {
              return item.type === "blob" && /\.pdf$/i.test(item.path);
            })
            .sort(function(a, b) {
              return a.path.localeCompare(b.path, "zh-CN", { sensitivity: "base" });
            });

          pdfFiles.forEach(function(file) {
            fileList.appendChild(createFileRow(file));
          });

          status.textContent = pdfFiles.length
            ? "已自动加载 " + pdfFiles.length + " 个 PDF 文件。"
            : "存储仓库中暂时没有 PDF 文件。";
        })
        .catch(function(error) {
          console.error("无法读取存储仓库的 PDF 文件列表：", error);
          status.textContent = "自动列表暂时无法加载，请稍后刷新；下方手动条目仍可使用。";
        });
    })();
  </script>
</body>
</html>
