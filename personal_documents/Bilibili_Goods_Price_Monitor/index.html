<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bilibili 会员购商品价格历史">
  <title>Bilibili 商品价格历史</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --primary:#00a1d6;
      --ink:#172033;
      --muted:#667085;
      --line:#e5e9f0;
      --surface:#fff;
      --bg:#f4f7fb;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font:15px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    }

    main {
      width:min(1120px,calc(100% - 28px));
      margin:36px auto;
    }

    header { margin-bottom:22px; }

    h1 {
      margin:0 0 4px;
      font-size:clamp(1.6rem,4vw,2.25rem);
    }

    .subtitle,.muted { color:var(--muted); }

    .panel {
      padding:clamp(18px,3vw,28px);
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--surface);
      box-shadow:0 12px 35px rgb(20 40 80 / 7%);
    }

    .controls {
      display:grid;
      grid-template-columns:minmax(220px,2fr) repeat(2,minmax(150px,1fr));
      gap:16px;
    }

    label {
      display:grid;
      gap:6px;
      font-weight:650;
    }

    select {
      width:100%;
      padding:10px 12px;
      border:1px solid #cfd6e2;
      border-radius:10px;
      background:#fff;
      color:var(--ink);
      font:inherit;
    }

    .identity {
      display:flex;
      flex-wrap:wrap;
      align-items:baseline;
      gap:8px 18px;
      margin:22px 0 12px;
    }

    .identity h2 {
      margin:0;
      font-size:1.25rem;
    }

    .stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin:14px 0 20px;
    }

    .stat {
      padding:12px 14px;
      border-radius:12px;
      background:#f7f9fc;
    }

    .stat span {
      display:block;
      color:var(--muted);
      font-size:.82rem;
    }

    .stat strong { font-size:1.15rem; }

    .chart-wrap {
      position:relative;
      height:min(52vh,480px);
      min-height:300px;
    }

    /* 横向滚动区域：数据点较多时允许浏览更长的时间轴 */
    .chart-scroll {
      width:100%;
      height:100%;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-gutter:stable;
    }

    /*
     * Chart.js 的 canvas 放在可动态扩展宽度的容器中。
     * 实际宽度由 JavaScript 根据数据点数量设置。
     */
    .chart-stage {
      height:100%;
      min-width:100%;
    }

    .chart-stage canvas {
      display:block;
    }

    .message {
      margin:18px 0 0;
      padding:12px 14px;
      border-radius:10px;
      background:#fff7e8;
      color:#8a5700;
    }

    .message.error {
      background:#fff0f0;
      color:#a12626;
    }

    [hidden] { display:none !important; }

    @media (max-width:700px) {
      main { margin:18px auto; }
      .controls { grid-template-columns:1fr; }
      .stats { grid-template-columns:1fr; }
      .chart-wrap { height:360px; }
      .panel { border-radius:14px; }
    }
  </style>
</head>

<body>
<main>
  <header>
    <h1>Bilibili 商品价格历史</h1>
    <div class="subtitle">所有时间与统计区间均为 Asia/Shanghai（UTC+8）</div>
  </header>

  <section class="panel" aria-busy="true" id="dashboard">
    <div class="controls">
      <label>
        商品
        <select id="product-select" disabled></select>
      </label>

      <label>
        时间单位
        <select id="granularity-select">
          <option value="hourly">每小时</option>
          <option value="daily">每天</option>
        </select>
      </label>

      <label>
        价格指标
        <select id="metric-select">
          <option value="max">最高价</option>
          <option value="min">最低价</option>
          <option value="average" selected>平均价</option>
        </select>
      </label>
    </div>

    <div class="identity">
      <h2 id="product-name">正在加载…</h2>
      <span class="muted" id="product-id"></span>
    </div>

    <div class="muted">
      数据更新时间：<time id="updated-at">—</time>
    </div>

    <div class="stats" id="stats" hidden>
      <div class="stat">
        <span>图表最高价</span>
        <strong id="maximum">—</strong>
      </div>
      <div class="stat">
        <span>图表最低价</span>
        <strong id="minimum">—</strong>
      </div>
      <div class="stat">
        <span>图表平均价</span>
        <strong id="average">—</strong>
      </div>
    </div>

    <div class="chart-wrap">
      <div class="chart-scroll" id="chart-scroll">
        <div class="chart-stage" id="chart-stage">
          <canvas id="price-chart" aria-label="商品价格历史折线图"></canvas>
        </div>
      </div>
    </div>

    <p class="message" id="message">正在加载价格历史数据…</p>
  </section>
</main>

<script>
'use strict';

const CONFIG = Object.freeze({
  dataUrl: './data/price_history.json',
  timeZone: 'Asia/Shanghai'
});

const METRIC_LABELS = Object.freeze({
  max: '最高价',
  min: '最低价',
  average: '平均价'
});

const elements = {
  dashboard: document.querySelector('#dashboard'),
  product: document.querySelector('#product-select'),
  granularity: document.querySelector('#granularity-select'),
  metric: document.querySelector('#metric-select'),
  productName: document.querySelector('#product-name'),
  productId: document.querySelector('#product-id'),
  updatedAt: document.querySelector('#updated-at'),
  stats: document.querySelector('#stats'),
  maximum: document.querySelector('#maximum'),
  minimum: document.querySelector('#minimum'),
  average: document.querySelector('#average'),
  message: document.querySelector('#message'),
  chartScroll: document.querySelector('#chart-scroll'),
  chartStage: document.querySelector('#chart-stage')
};

let products = new Map();
let priceChart = null;
let dataUpdatedAt = null;

/**
 * 读取原始历史记录。
 *
 * 当前 price_history.json 的格式为：
 * [
 *   {
 *     "timestamp": "...",
 *     "price": 57.4,
 *     "product_id": "...",
 *     "product_type": "resell",
 *     "product_name": "..."
 *   }
 * ]
 */
async function loadPriceHistory() {
  const response = await fetch(`${CONFIG.dataUrl}?t=${Date.now()}`, {
    cache: 'no-store'
  });

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  const payload = await response.json();

  if (!Array.isArray(payload)) {
    throw new TypeError('价格历史 JSON 格式错误：顶层应为记录数组');
  }

  return payload;
}

function parseTimestamp(value) {
  const timestamp = Date.parse(value);
  return Number.isFinite(timestamp) ? timestamp : null;
}

function isValidRecord(record) {
  if (!record || typeof record !== 'object') return false;

  const timestamp = parseTimestamp(record.timestamp);
  const price = Number(record.price);
  const productId = String(record.product_id || record.cluster_id || '').trim();

  return (
    timestamp !== null &&
    Number.isFinite(price) &&
    productId.length > 0
  );
}

/**
 * 将一个时间转换成 Asia/Shanghai 的年月日时。
 *
 * formatToParts 可以避免浏览器本地时区影响分桶。
 */
function getShanghaiParts(timestamp) {
  const formatter = new Intl.DateTimeFormat('en-CA', {
    timeZone: CONFIG.timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    hour12: false,
    hourCycle: 'h23'
  });

  const parts = Object.fromEntries(
    formatter
      .formatToParts(new Date(timestamp))
      .filter(part => part.type !== 'literal')
      .map(part => [part.type, part.value])
  );

  return {
    year: Number(parts.year),
    month: Number(parts.month),
    day: Number(parts.day),
    hour: Number(parts.hour)
  };
}

/**
 * 生成 UTC+8 分桶。
 *
 * hourly:
 *   10:00 <= timestamp < 11:00 -> 同一个 10:00 桶
 *
 * daily:
 *   当日 00:00 <= timestamp < 次日 00:00 -> 同一个日期桶
 */
function getBucketDescriptor(timestamp, granularity) {
  const { year, month, day, hour } = getShanghaiParts(timestamp);

  if (granularity === 'hourly') {
    const key = [
      String(year).padStart(4, '0'),
      String(month).padStart(2, '0'),
      String(day).padStart(2, '0'),
      String(hour).padStart(2, '0')
    ].join('-');

    return {
      key,
      sortValue: Date.UTC(year, month - 1, day, hour),
      label: `${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')} ${String(hour).padStart(2, '0')}:00`
    };
  }

  const key = [
    String(year).padStart(4, '0'),
    String(month).padStart(2, '0'),
    String(day).padStart(2, '0')
  ].join('-');

  return {
    key,
    sortValue: Date.UTC(year, month - 1, day),
    label: `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`
  };
}

function roundToTwo(value) {
  if (!Number.isFinite(value)) return value;
  return Math.round((value + Number.EPSILON) * 100) / 100;
}

function aggregateRecords(records, granularity) {
  const buckets = new Map();

  for (const record of records) {
    const timestamp = parseTimestamp(record.timestamp);
    const price = Number(record.price);

    if (timestamp === null || !Number.isFinite(price)) continue;

    const descriptor = getBucketDescriptor(timestamp, granularity);

    if (!buckets.has(descriptor.key)) {
      buckets.set(descriptor.key, {
        key: descriptor.key,
        label: descriptor.label,
        sortValue: descriptor.sortValue,
        prices: []
      });
    }

    buckets.get(descriptor.key).prices.push(price);
  }

  return Array.from(buckets.values())
    .sort((a, b) => a.sortValue - b.sortValue)
    .map(bucket => {
      const prices = bucket.prices;
      const sum = prices.reduce((total, price) => total + price, 0);

      return {
        time: bucket.key,
        label: bucket.label,
        max: Math.max(...prices),
        min: Math.min(...prices),
        average: roundToTwo(sum / prices.length),
        sampleCount: prices.length
      };
    });
}

/**
 * 将原始记录按商品分组。
 *
 * 商品名称使用该商品按时间排序后“最后一个非空 product_name”，
 * 因为历史早期记录可能没有名称。
 */
function normalizeProducts(records) {
  const grouped = new Map();

  const validRecords = records
    .filter(isValidRecord)
    .map(record => ({
      ...record,
      product_id: String(record.product_id || record.cluster_id).trim(),
      product_type: String(record.product_type || 'resell').trim() || 'resell',
      product_name: String(record.product_name || '').trim(),
      price: Number(record.price),
      _timestamp: parseTimestamp(record.timestamp)
    }))
    .sort((a, b) => a._timestamp - b._timestamp);

  for (const record of validRecords) {
    const productId = record.product_id;

    if (!grouped.has(productId)) {
      grouped.set(productId, {
        product_id: productId,
        product_type: record.product_type,
        name: '',
        url: record.url || '',
        records: []
      });
    }

    const product = grouped.get(productId);
    product.records.push(record);

    if (record.product_name) {
      product.name = record.product_name;
    }

    if (record.product_type) {
      product.product_type = record.product_type;
    }

    if (record.url) {
      product.url = record.url;
    }
  }

  for (const product of grouped.values()) {
    product.hourly = aggregateRecords(product.records, 'hourly');
    product.daily = aggregateRecords(product.records, 'daily');
  }

  return grouped;
}

function getLatestTimestamp(records) {
  let latest = null;

  for (const record of records) {
    const timestamp = parseTimestamp(record?.timestamp);
    if (timestamp !== null && (latest === null || timestamp > latest)) {
      latest = timestamp;
    }
  }

  return latest;
}

function renderProductSelector() {
  const options = Array.from(products, ([key, product]) => {
    const name = product.name || `商品 ${product.product_id}`;
    return new Option(`${name} (${product.product_id})`, key);
  });

  elements.product.replaceChildren(...options);
  elements.product.disabled = products.size === 0;
}

function validMetricValues(points, metric) {
  return points
    .map(point => point[metric])
    .filter(value => Number.isFinite(value));
}

function formatPrice(value) {
  return Number.isFinite(value) ? `${value.toFixed(2)} 元` : '—';
}

function formatUpdatedAt(timestamp) {
  if (!Number.isFinite(timestamp)) return '无记录';

  return new Intl.DateTimeFormat('zh-CN', {
    timeZone: CONFIG.timeZone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(new Date(timestamp));
}

function updateStatistics(values) {
  if (!values.length) {
    elements.stats.hidden = true;
    return;
  }

  elements.maximum.textContent = formatPrice(Math.max(...values));
  elements.minimum.textContent = formatPrice(Math.min(...values));
  elements.average.textContent = formatPrice(
    roundToTwo(values.reduce((sum, value) => sum + value, 0) / values.length)
  );

  elements.stats.hidden = false;
}

function renderChart(product, points, metric, granularity) {
  if (priceChart) {
    priceChart.destroy();
  }

  /*
   * 给每个时间点预留足够的横向空间。
   * 数据点较多时 chart-stage 会宽于可视区域，从而出现横向滚动条。
   */
  const pixelsPerPoint = granularity === 'hourly' ? 72 : 90;
  const viewportWidth = elements.chartScroll.clientWidth || 0;
  const requiredWidth = Math.max(viewportWidth, points.length * pixelsPerPoint);
  elements.chartStage.style.width = `${requiredWidth}px`;

  priceChart = new Chart(document.querySelector('#price-chart'), {
    type: 'line',
    data: {
      labels: points.map(point => point.label),
      datasets: [{
        label: `${METRIC_LABELS[metric]}（元）`,
        data: points.map(point =>
          Number.isFinite(point[metric]) ? point[metric] : null
        ),
        borderColor: '#00a1d6',
        backgroundColor: 'rgb(0 161 214 / 12%)',
        pointRadius: 3,
        pointHoverRadius: 5,
        tension: 0.2,
        spanGaps: false,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        intersect: false,
        mode: 'index'
      },
      scales: {
        x: {
          title: {
            display: true,
            text: granularity === 'hourly'
              ? '时间（UTC+8，每小时）'
              : '日期（UTC+8，每天）'
          }
        },
        y: {
          title: {
            display: true,
            text: '价格（人民币 / 元）'
          },
          ticks: {
            stepSize: 0.5,
            callback(value) {
              return Number(value).toFixed(1);
            }
          }
        }
      },
      plugins: {
        tooltip: {
          callbacks: {
            label(context) {
              if (context.parsed.y === null) {
                return '该时间桶无样本';
              }

              const point = points[context.dataIndex];
              return [
                `${METRIC_LABELS[metric]}：${formatPrice(context.parsed.y)}`,
                `样本数：${point.sampleCount}`
              ];
            }
          }
        }
      }
    }
  });

  /*
   * 默认显示时间最近的数据：
   * 每次渲染后把横向滚动条移动到最右侧。
   */
  requestAnimationFrame(() => {
    elements.chartScroll.scrollLeft =
      elements.chartScroll.scrollWidth - elements.chartScroll.clientWidth;
  });
}

function showMessage(text, isError = false) {
  elements.message.textContent = text;
  elements.message.classList.toggle('error', isError);
  elements.message.hidden = false;
}

function updateChart() {
  const product = products.get(elements.product.value);

  if (!product) {
    showMessage('暂无价格历史数据');
    elements.stats.hidden = true;
    return;
  }

  const granularity = elements.granularity.value;
  const metric = elements.metric.value;
  const points = product[granularity] || [];

  elements.productName.textContent =
    product.name || `商品 ${product.product_id}`;

  elements.productId.textContent =
    `商品 ID：${product.product_id}（${product.product_type || 'resell'}）`;

  elements.updatedAt.textContent = formatUpdatedAt(dataUpdatedAt);

  const values = validMetricValues(points, metric);

  updateStatistics(values);
  renderChart(product, points, metric, granularity);

  if (!values.length) {
    showMessage('暂无价格历史数据');
  } else {
    elements.message.hidden = true;
  }
}

async function initializeDashboard() {
  try {
    const records = await loadPriceHistory();

    products = normalizeProducts(records);
    dataUpdatedAt = getLatestTimestamp(records);

    renderProductSelector();

    if (!products.size) {
      elements.productName.textContent = '暂无商品';
      elements.productId.textContent = '';
      showMessage('价格历史文件中没有有效记录');
      return;
    }

    updateChart();
  } catch (error) {
    console.error(error);

    elements.productName.textContent = '数据加载失败';
    elements.productId.textContent = '';

    showMessage(
      error instanceof TypeError
        ? error.message
        : '无法加载价格历史数据，请稍后重试。',
      true
    );
  } finally {
    elements.dashboard.setAttribute('aria-busy', 'false');
  }
}

[
  elements.product,
  elements.granularity,
  elements.metric
].forEach(control => {
  control.addEventListener('change', updateChart);
});

initializeDashboard();
</script>
</body>
</html>
